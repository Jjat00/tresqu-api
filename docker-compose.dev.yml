services:
  db:
    image: ankane/pgvector
    container_name: pg-local-cashbot-vector
    restart: unless-stopped
    environment:
      POSTGRES_USER: cashbot
      POSTGRES_PASSWORD: cashbot
      POSTGRES_DB: cashbot
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: cashbot-api
    restart: unless-stopped
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://cashbot:cashbot@db:5433/cashbot
      - DEBUG=True
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

volumes:
  db-data:
